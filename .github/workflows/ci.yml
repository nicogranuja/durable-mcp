name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs; the comment shows the release.
jobs:
  test:
    name: test (Go ${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The minimum version go.mod declares, and the latest release.
        include:
          - name: go.mod minimum
            go-version-file: go.mod
          - name: stable
            go-version: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}
          cache-dependency-path: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: go build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: go.mod
      - name: go mod tidy
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0 # keep in sync with GOLANGCI_LINT_VERSION in the Makefile
      # Static check that workflow code avoids clocks, randomness, I/O, and
      # map iteration, which can break replay. Pinned in the Makefile.
      - name: workflowcheck
        run: make workflowcheck

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Check out here rather than in the action, so credentials are not
      # persisted, as in the other jobs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-input: stable
          cache-dependency-path: go.mod

  # Builds the container image (never pushed) and checks it the way the README
  # runs it. Docker is not needed anywhere else, so this is where the image is
  # proven.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: durable-mcp:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dockerfile's Go version matches go.mod
        run: |
          mod=$(sed -n 's/^go \([0-9]*\.[0-9]*\).*/\1/p' go.mod)
          img=$(sed -n 's/^ARG GO_VERSION=//p' Dockerfile)
          echo "go.mod: $mod, Dockerfile: $img"
          test -n "$mod" && test "$mod" = "$img"
      - name: docker build
        run: docker build --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" -t "$IMAGE" .
      - name: Smoke test
        run: |
          docker run --rm "$IMAGE" --help
          out=$(docker run --rm "$IMAGE" -version)
          echo "$out"
          test "$out" = "durable-mcp ci (commit $GITHUB_SHA)"
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" = "$GITHUB_SHA"
      - name: Runs as a non-root user
        run: |
          user=$(docker inspect --format '{{.Config.User}}' "$IMAGE")
          echo "image user: $user"
          test "$user" = "65532:65532"
      - name: serve refuses a non-loopback address without tokens
        run: |
          code=0
          docker run --rm "$IMAGE" serve -transport http -http-addr 0.0.0.0:8080 2> err.txt || code=$?
          cat err.txt
          test "$code" -eq 2
          grep -q 'is not a loopback address' err.txt
      - name: serve with a mounted tokens file, /metrics, and a graceful stop
        run: |
          docker run --rm "$IMAGE" token ci > minted.txt
          token=$(sed -n 's/^token: //p' minted.txt)
          sed -n 's/^entry: //p' minted.txt > "$RUNNER_TEMP/tokens"
          rm minted.txt
          docker run -d --name serve \
            -v "$RUNNER_TEMP/tokens:/run/secrets/durable-mcp-tokens:ro" \
            -p 127.0.0.1:8080:8080 -p 127.0.0.1:9464:9464 \
            "$IMAGE" serve -transport http -http-addr 0.0.0.0:8080 \
            -auth-tokens-file /run/secrets/durable-mcp-tokens -metrics-addr 0.0.0.0:9464
          for _ in $(seq 30); do
            curl -s -o /dev/null http://127.0.0.1:8080/mcp && break
            sleep 1
          done
          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          post() {
            curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/mcp "$@" \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d "$body"
          }
          test "$(post)" = 401
          test "$(post -H "Authorization: Bearer $token")" = 200
          code() { curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$1"; }
          test "$(code /healthz)" = 200
          # No Temporal server in this step: serve is alive but not ready.
          test "$(code /readyz)" = 503
          curl -sSf -o metrics.txt http://127.0.0.1:9464/metrics
          grep -q '^http_server_request_duration_seconds' metrics.txt
          start=$(date +%s)
          docker stop -t 70 serve
          echo "stopped in $(( $(date +%s) - start ))s"
          docker logs serve
          test "$(docker inspect --format '{{.State.ExitCode}}' serve)" -eq 0
          if docker logs serve 2>&1 | grep -qF "$token"; then echo "the token is in the logs"; exit 1; fi
          docker rm serve
      - name: docker compose example
        env:
          DURABLE_MCP_TOKENS_FILE: ${{ runner.temp }}/tokens
          COMPOSE_FILE: deploy/compose/compose.yaml
        run: |
          docker compose config -q
          docker compose up -d --build --wait --wait-timeout 120
          for _ in $(seq 30); do
            docker compose logs worker | grep -q 'Started Worker' && break
            sleep 1
          done
          docker compose ps
          docker compose logs worker
          docker compose logs worker | grep -q 'Started Worker'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/mcp)" = 401
          for _ in $(seq 30); do
            curl -sf -o /dev/null http://127.0.0.1:8080/readyz && break
            sleep 1
          done
          curl -sSf http://127.0.0.1:8080/readyz
          docker compose down -t 70
