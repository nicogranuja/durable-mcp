version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose     # unclosed HTTP response bodies leak connections
    - errname       # ErrFoo sentinels, FooError types
    - errorlint     # errors.Is/As instead of == and type assertions
    - gocritic
    - gosec
    - misspell
    - modernize
    - noctx         # HTTP requests must carry a context
    - nolintlint
    - revive        # includes doc comments on exported identifiers
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    govet:
      enable:
        - nilness
        - shadow
      settings:
        shadow:
          strict: false
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: error-naming
        - name: error-return
        - name: errorf
        - name: context-as-argument
        - name: context-keys-type
        - name: receiver-naming
        - name: unused-parameter
        - name: unexported-return
        - name: blank-imports
        - name: superfluous-else
        - name: use-any
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      # Tests talk to local httptest servers with fixture data.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nicogranuja/durable-mcp
